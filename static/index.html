<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Python Coding Tutor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --line:#e1e4e8; --ink:#1f2328; --muted:#656d76; --accent:#2f6feb; --ok:#1a7f37; --bad:#cf222e; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  #app { display: none; height: 100%; }
  #app.on { display: flex; }
  #left { width: 40%; min-width: 320px; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); }
  #divider { width: 5px; cursor: col-resize; background: var(--line); }
  #divider:hover { background: var(--accent); }
  #right { flex: 1; min-width: 300px; position: relative; }
  #right iframe { width: 100%; height: 100%; border: 0; }
  #nbhint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  header { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 15px; margin: 0; flex: 1; }
  .badge { background: #ddf4ff; color: #0969da; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: #f6f8fa; border-radius: 6px; padding: 6px 12px; }
  button:hover:not(:disabled) { background: #eef1f4; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover:not(:disabled) { background: #1f5fd8; }
  button.good { background: var(--ok); color: #fff; border-color: var(--ok); }
  #knowledge { display: none; padding: 10px 14px; background: #fffbea; border-bottom: 1px solid var(--line); font-size: 13px; }
  #knowledge.on { display: block; }
  #knowledge h4 { margin: 6px 0 2px; font-size: 12px; text-transform: uppercase; color: var(--muted); }
  #msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .m { max-width: 92%; padding: 8px 12px; border-radius: 10px; word-wrap: break-word; }
  .m.assistant { background: #f1f3f5; align-self: flex-start; }
  .m.user { background: var(--accent); color: #fff; align-self: flex-end; }
  .m.problem { background: #fff8e6; border: 1px solid #f0d78c; align-self: stretch; max-width: 100%; }
  .m p { margin: 4px 0; }
  .m pre { background: #1f2328; color: #f0f3f6; padding: 8px 10px; border-radius: 6px; overflow-x: auto; margin: 6px 0; }
  .m code { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  .m :not(pre) > code { background: rgba(0,0,0,.08); padding: 1px 4px; border-radius: 4px; }
  .m.user :not(pre) > code { background: rgba(255,255,255,.25); }
  table.tests { border-collapse: collapse; margin-top: 8px; width: 100%; font-size: 12px; }
  table.tests td { border-top: 1px solid var(--line); padding: 3px 6px; vertical-align: top; font-family: ui-monospace, Menlo, monospace; }
  .pass { color: var(--ok); font-weight: 700; } .fail { color: var(--bad); font-weight: 700; }
  pre.err { background: #ffebe9; color: #82071e; }
  #actions { padding: 8px 14px 0; display: flex; gap: 8px; flex-wrap: wrap; }
  #composer { padding: 10px 14px 14px; display: flex; gap: 8px; }
  #composer textarea { flex: 1; resize: none; font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 6px; }
  #onboard { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; }
  #onboard .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 28px; width: min(560px, 92vw); }
  #onboard h2 { margin-top: 0; }
  #onboard textarea { width: 100%; height: 140px; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 6px; margin: 8px 0 14px; }
  .err-banner { color: var(--bad); margin-top: 8px; }
  .spin::after { content: ""; display: inline-block; width: 12px; height: 12px; margin-left: 8px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: s .7s linear infinite; vertical-align: -2px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="onboard" style="display:none">
  <div class="card">
    <h2>🐍 Python Coding Tutor</h2>
    <p>Tell me about your current Python knowledge — what you can do comfortably and where you struggle. I'll pick problems that fit and adapt as you go.</p>
    <textarea id="ob-text" placeholder="e.g. I can write simple expressions and basic functions, but I struggle with simple LeetCode problems. I'd like to start with loops."></textarea>
    <button class="primary" id="ob-go">Start learning</button>
    <div id="ob-err" class="err-banner"></div>
  </div>
</div>

<div id="app">
  <div id="left">
    <header>
      <h1>Python Tutor</h1>
      <span class="badge" id="level">Level –</span>
      <button id="kbtn">My knowledge</button>
      <button id="reset" title="Start over">↺</button>
    </header>
    <div id="knowledge"></div>
    <div id="msgs"></div>
    <div id="actions">
      <button class="good" id="check">✅ I've solved it – run tests</button>
      <button id="next" style="display:none" class="primary">➡ Next problem</button>
      <button id="easier">😕 I'm stuck – easier one</button>
    </div>
    <div id="composer">
      <textarea id="input" rows="2" placeholder="Ask for a hint or explanation… (Enter to send)"></textarea>
      <button class="primary" id="send">Send</button>
    </div>
  </div>
  <div id="divider"></div>
  <div id="right"><div id="nbhint">Loading notebook…</div><iframe id="nb"></iframe></div>
</div>

<script>
const $ = id => document.getElementById(id);
let state = null, busy = false, shownNotebook = null;

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(src) {
  const parts = src.split(/```(?:\w+)?\n([\s\S]*?)```/g);
  return parts.map((p, i) => {
    if (i % 2) return `<pre><code>${esc(p)}</code></pre>`;
    return esc(p).split(/\n{2,}/).map(par => {
      par = par.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*\w])[*_]([^*_\n]+)[*_]/g, '$1<i>$2</i>');
      if (/^\s*[-*] /m.test(par)) return '<ul>' + par.split('\n').map(l => l.replace(/^\s*[-*] (.*)/, '<li>$1</li>')).join('') + '</ul>';
      return `<p>${par.replace(/\n/g, '<br>')}</p>`;
    }).join('');
  }).join('');
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    let d = r.statusText;
    try { d = (await r.json()).detail || d; } catch {}
    throw new Error(d);
  }
  return r.json();
}
const post = (path, body) => api(path, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined });

function setBusy(b, label) {
  busy = b;
  ['check', 'next', 'easier', 'send'].forEach(id => $(id).disabled = b);
  if (b) { $('msgs').insertAdjacentHTML('beforeend', `<div class="m assistant spin" id="thinking">${label || 'Thinking'}</div>`); scroll(); }
  else $('thinking')?.remove();
}
const scroll = () => $('msgs').scrollTop = $('msgs').scrollHeight;
function bubble(role, html, cls = '') { $('msgs').insertAdjacentHTML('beforeend', `<div class="m ${role} ${cls}">${html}</div>`); scroll(); }

function resultHtml(m) {
  let h = md(m.content);
  const r = m.result;
  if (r.load_error) h += `<pre class="err"><code>${esc(r.load_error)}</code></pre>`;
  if (r.results.length) {
    const n = r.results.filter(x => x.passed).length;
    h += `<b>${n}/${r.results.length} tests passed</b><table class="tests">` + r.results.map(x =>
      `<tr><td class="${x.passed ? 'pass' : 'fail'}">${x.passed ? '✓' : '✗'}</td><td>${esc(x.call)}` +
      (x.passed ? '' : `<br>expected ${esc(x.expected)}<br>${x.error ? esc(x.error) : 'got ' + esc(x.actual)}`) + `</td></tr>`).join('') + '</table>';
  }
  return h;
}

function render() {
  const s = state;
  $('level').textContent = `Level ${s.level}/10`;
  $('knowledge').innerHTML = `<h4>Beginning knowledge</h4>${esc(s.beginning_knowledge)}<h4>Current knowledge</h4>${esc(s.current_knowledge)}` +
    `<h4>History</h4>${s.history.map(h => `${h.result === 'passed' ? '✅' : '⏭'} ${esc(h.title)} (d${h.difficulty})`).join('<br>') || '–'}`;
  $('msgs').innerHTML = '';
  s.chat.forEach(m => {
    if (m.kind === 'result') bubble('assistant', resultHtml(m));
    else bubble(m.role, m.role === 'user' ? esc(m.content) : md(m.content), m.kind === 'problem' ? 'problem' : '');
  });
  const passed = s.current?.passed;
  $('check').style.display = passed ? 'none' : '';
  $('easier').style.display = passed ? 'none' : '';
  $('next').style.display = passed ? '' : 'none';
  if (s.current && s.current.notebook !== shownNotebook) {
    shownNotebook = s.current.notebook;
    $('nb').src = s.current.notebook_url.replace('localhost', location.hostname);
    $('nbhint').style.display = 'none';
  }
}

function show() {
  $('onboard').style.display = state.onboarded ? 'none' : 'flex';
  $('app').classList.toggle('on', state.onboarded);
  if (state.onboarded) render();
}

async function run(label, fn) {
  if (busy) return;
  setBusy(true, label);
  try { await fn(); } catch (e) { setBusy(false); bubble('assistant', `<span class="fail">Error:</span> ${esc(e.message)}`); return; }
  setBusy(false);
}

$('ob-go').onclick = async () => {
  $('ob-err').textContent = '';
  $('ob-go').disabled = true; $('ob-go').textContent = 'Preparing your first problem…';
  try { state = await post('/api/onboard', { text: $('ob-text').value }); show(); }
  catch (e) { $('ob-err').textContent = e.message; }
  $('ob-go').disabled = false; $('ob-go').textContent = 'Start learning';
};

$('check').onclick = () => run('Running tests', async () => {
  const r = await post('/api/check'); state = r.state; render();
});
$('next').onclick = () => run('Creating next problem', async () => { state = await post('/api/next'); render(); });
$('easier').onclick = () => run('Finding an easier problem', async () => { state = await post('/api/next?skip=true'); render(); });

async function send() {
  const text = $('input').value.trim();
  if (!text || busy) return;
  $('input').value = '';
  bubble('user', esc(text));
  run('Thinking', async () => { const r = await post('/api/chat', { message: text }); bubble('assistant', md(r.reply)); });
}
$('send').onclick = send;
$('input').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
$('kbtn').onclick = () => $('knowledge').classList.toggle('on');
$('reset').onclick = async () => {
  if (!confirm('Start over? This clears your progress and knowledge profile.')) return;
  await post('/api/reset'); shownNotebook = null; $('nb').src = 'about:blank';
  state = await api('/api/state'); show();
};

// draggable divider
$('divider').onmousedown = e => {
  const mv = ev => { $('left').style.width = Math.max(320, ev.clientX) + 'px'; $('nb').style.pointerEvents = 'none'; };
  const up = () => { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); $('nb').style.pointerEvents = ''; };
  document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up); e.preventDefault();
};

api('/api/state').then(s => { state = s; show(); });
</script>
</body>
</html>
